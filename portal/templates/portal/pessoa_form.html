{% extends "portal/base.html" %}
{% block titulo %}Nova pessoa — Portal FACE{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="mb-3">Cadastrar nova pessoa</h4>
            <form method="post">
                {% csrf_token %}
                {% for campo in form %}
                <div class="mb-3">
                    <label class="form-label">{{ campo.label }}</label>
                    {{ campo }}
                    {% if campo.errors %}<div class="text-danger small">{{ campo.errors|striptags }}</div>{% endif %}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary">Cadastrar</button>
                <a href="{% url 'portal:pessoa_list' %}" class="btn btn-link">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
