{% with s=pedido.status %}<span class="badge {% if s == 'realizado' %}bg-success{% elif s == 'agendado' %}bg-warning text-dark{% elif s == 'para_agendar' or s == 'para_reagendar' or s == 'aguardando' %}bg-primary{% elif s == 'nao_realizado' or s == 'nao_respondeu' %}bg-danger{% else %}bg-secondary{% endif %}">{{ pedido.get_status_display }}</span>{% if pedido.status_detalhe %}<div class="small text-muted">{{ pedido.status_detalhe }}</div>{% endif %}{% endwith %}
